name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publicar como esta tag (ex.: v0.5.0); vazio = só gera os instaladores"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      # O gate pdfium_binds_when_ci_requires_it exige a lib sob CI (mesmo
      # padrão do pr.yml: baixa o asset e planta ao lado do binário de teste).
      - name: Pdfium
        shell: bash
        env:
          PDFIUM_RELEASE: chromium/8044
        run: |
          curl -fsSL --max-time 180 -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-mac-arm64.tgz"
          mkdir -p pdfium-extract
          tar xzf pdfium.tgz -C pdfium-extract
          FOUND="$(find pdfium-extract -name 'libpdfium.dylib' -type f | head -n 1)"
          test -n "$FOUND"
          cargo test -p tsuro --lib --no-run -- --test-threads=1
          for dest in target/debug/deps target/debug/Frameworks target/debug; do
            mkdir -p "$dest"
            cp "$FOUND" "$dest/libpdfium.dylib"
          done
      - name: Testes Rust
        shell: bash
        run: |
          cargo test -p tsuro --lib -- --test-threads=1
          cargo test -p tsuro-sign --lib
      - name: Testes do instalador Bun
        run: bun test scripts/install-tsuro
      - name: DMG
        run: ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/TsuroPDF-*-aarch64-apple-darwin.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Pdfium
        shell: bash
        env:
          PDFIUM_RELEASE: chromium/8044
        run: |
          curl -fsSL --max-time 180 -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-win-x64.tgz"
          mkdir -p pdfium-extract
          tar xzf pdfium.tgz -C pdfium-extract
          FOUND="$(find pdfium-extract -name 'pdfium.dll' -type f | head -n 1)"
          test -n "$FOUND"
          cargo test -p tsuro --lib --no-run -- --test-threads=1
          for dest in target/debug/deps target/debug; do
            mkdir -p "$dest"
            cp "$FOUND" "$dest/pdfium.dll"
          done
      - name: Testes Rust
        shell: bash
        run: |
          cargo test -p tsuro --lib -- --test-threads=1
          cargo test -p tsuro-sign --lib
      - name: NSIS
        run: choco install nsis -y --no-progress
      - name: Instalador
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: dist/TsuroPDF-*-x86_64-pc-windows-msvc-setup.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    # Tag enviada, ou disparo manual com `tag` (o próprio job cria a tag).
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          export TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [ -n "$INPUT_TAG" ]; then
            # Disparo manual: a tag tem de bater com a versão do Cargo.toml e
            # nasce no commit que acabou de ser compilado e testado.
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
            test "$TAG" = "v$VERSION"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi
          mkdir -p out
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} out/ \;
          test "$(find out -type f | wc -l)" -ge 2
          cd out
          sha256sum * | tee SHA256SUMS
          NOTES="$(mktemp)"
          cat >"$NOTES" <<EOF
          TsuroPDF ${TAG} — macOS nativo: menu do sistema, barra unificada e ícones do tema

          Novidades desde a v0.5.5:

          - **Menu do sistema no macOS** (#178): Arquivo, Editar, Ver, Ir e Ajuda vivem na barra do macOS, com Cmd+Q, esconder e "Sobre" do jeito nativo; Windows e Linux seguem com a lista do ⋯.
          - **Barra unificada** (#174, #181): a faixa encosta no topo, os controles ficam na linha dos semáforos e a janela só arrasta nas áreas vazias — clicar no número da página ou no nome do arquivo não move mais o app.
          - **Página e zoom num lugar só** (#180): o indicador saiu do rodapé, ficou centrado na barra e acompanha documentos de 2 a 900 páginas; a pílula do rodapé virou só o estado de Modo Anotação.
          - **Fundação visual Kiri** (#168, #171, #173): tokens semânticos, Inter embarcada, tema do sistema por padrão e o chrome na escala aprovada — sidebar 256, faixa de abas 26, menu raio 12, folha 26, dica 19 e progresso 6.
          - **Ícones do tema** (#182): os 28 Ori saem em `currentColor` e são tingidos pelo acento, então o tema claro deixa de ter ícone pálido a 2:1 de contraste.
          - **Aba Marcações** (#162): lista as marcações da sessão com busca e salto, ao lado de Páginas e Sumário.
          - **Diário de recuperação** (#163): marcação não salva sobrevive a fechar o app ou a queda, com o cartão de recuperação na abertura.
          - **Exportar marcações** (#158): Markdown com página, tipo e trecho, por Cmd+E.
          - **Assinaturas mais honestas** (#164): cada checagem aparece com o seu resultado, com texto claro quando o resumo diverge ou é ilegível.
          - **Abrir arquivo sem travar a janela** (#169): o seletor do sistema abre como folha, assíncrono.
          EOF
          # PRs mergeadas com @autores (visibilidade open-source; rodapé Full
          # Changelog próprio do template, então filtra o gerado). Falha aqui
          # não bloqueia a release: registra o aviso nas notas.
          {
            PREV="$(gh release list --json tagName --jq "[.[].tagName | select(. != env.TAG)] | .[0] // empty")"
            ARGS=(-f "tag_name=$TAG")
            [ -n "$PREV" ] && ARGS+=(-f "previous_tag_name=$PREV")
            echo ""
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq .body \
              | grep -v '^\*\*Full Changelog\*\*' \
              || echo "_Lista de PRs indisponível._"
          } >>"$NOTES"
          cat >>"$NOTES" <<EOF

          **Full Changelog**: https://github.com/claudioorjunior/tsuro-pdf/compare/v0.5.5...${TAG}

          Instalação:

          - Mac Apple Silicon: \`TsuroPDF-*-aarch64-apple-darwin.dmg\` — arraste para Applications.
            Na primeira abertura: clique com o botão direito em TsuroPDF → Abrir (assinatura ad-hoc, sem Apple Developer Program).
          - Windows x64: \`TsuroPDF-*-x86_64-pc-windows-msvc-setup.exe\` — instala em %LOCALAPPDATA%\\Programs\\TsuroPDF, sem admin.
            Se o SmartScreen aparecer: Mais informações → Executar assim mesmo.

          SHA-256 em \`SHA256SUMS\`. Instalador terminal: \`bun run install:tsuro -- --install\`.
          EOF
          gh release create "$TAG" --title "TsuroPDF ${TAG}" --notes-file "$NOTES" ./*
