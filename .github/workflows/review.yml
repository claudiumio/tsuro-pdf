name: Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  coauthors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: co-author identities
        # Runs before the Rust jobs: a bad trailer is caught in seconds.
        run: ./scripts/check-coauthors.sh "origin/${{ github.base_ref || 'main' }}"
  review:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        # -p keeps rustfmt off src-tauri (legacy).
        run: cargo fmt -p tsuro -p tsuro-sign -- --check
      - name: clippy
        run: cargo clippy -p tsuro -p tsuro-sign --all-targets
